PERMISSIONS:
  current: Prepare local authoring tools and inspect inputs; no game replacement.
  installation: Explicit user approval required for official Blender installation.
  external_services: No API payments, credential collection or image upload approved.
  mcp: Optional later; reviewed pinned version and separate setup permission, not a prerequisite.
