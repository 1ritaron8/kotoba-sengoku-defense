DECISIONS:
  preserve: Working combat, learning, progression, user saves, verified common color boundary and useful overlay implementation.
  replace: Unsuitable canopy assets/assembly and inadequate facility/material shapes; no preservation merely because code exists.
  first_source: Editable Blender models and baked/importable PBR material inputs, not another whole-canopy photograph on a curved surface.
  image_target: Exact full composition plus materials, depth, scale and UI hierarchy; no proxy reference.
  camera: Existing orthographic23.5/elevation44 for initial comparison; do not silently switch to perspective.
  context: Existing ground is workshop context, not an irrevocable final art shape. Replacement gameplay surfaces require coherent world/placement/nav updates and affected checks.
  hardware: Inspect actual engine and hardware; current report says Iris Xe; do not promise60FPS.
AFTER_BLENDER_APPROVAL:
  - Run kit bootstrap once; check workshop orientation and reference image.
  - Produce an actual broadleaf prototype from branching geometry and leaf-scale assets, not full-tree photographic plates.
  - Author one real raised firing-platform/short-palisade module and dirt/grass/litter transition in the SAME review segment.
  - Bake procedural materials to images and export selected assets to GLB; no default-material fallback declared final.
  - Inspect Godot import in an isolated authored test scene before connecting the normal candidate path.
  - Compare to reference at full-frame1440x900 and1280x800; retain context/HUD differences explicitly.
  - Show ordinary candidate movement/placement/combat after scoped integration; art-only stage is not naturalplayPASS.
TEAMS:
  HQ: Confirm approved setup scope, own runtime checks and one compact report. No new sessions or repeated history reviews.
  UX_GRAPHICS: Own .blend, texture sources, UV/materials, tree/platform/ground segment and asset-level visual decisions.
  FUNCTIONAL: Own export/import contract, world-coordinate/scale/collision bindings. Do not recreate procedural art in gameplay script.
  QA: Replace an author after freeze; actual imports/images and relevant checks. No unrelated658-test or R6 rerun.
  MOTION: Park existing logic; provide an already available representative actor through existing systems, no PNG substitution.
  BALANCE: Park; no stat/skill updates.
FIRST_ART_GATE:
  success: Same-scene tree+ground+platform show credible branch structure, surface scale, physical depth and coherent light; a code/tooling PASS is insufficient.
  failure: Name exact inadequate asset, input, or import limitation. At most one correction; do not restart a cascade of canopy parameter rounds.
  external_fallback: Select one generator only for a specific failed asset after user approves upload and spending cap. Whole game/repository upload forbidden.
OPERATION:
  active_workers_max_excluding_HQ: 2
  writer_per_exact_file: 1
  engine_executor: HQ
  first_art_round_minutes: {target: 45, maximum: 60}
  first_art_round_start: Actual approved production start; setup approval is not a perpetual self-renewing clock.
  report: New source assets, actual imports/captures, observed quality gaps, frame distribution and clearly untested scope.
  automatic_followup: false
