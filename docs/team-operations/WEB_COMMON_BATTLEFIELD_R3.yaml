USER_DECISION:
  replace: >-
    Replace unsuitable implementations decisively within the assigned module. Prior
    coding effort is not a reason to preserve a broken design. Reuse sound interfaces;
    avoid both endless corrective layers and an unbounded whole-game rewrite.
  cleanup: >-
    User authorizes autonomous removal of proven-obsolete project files under the
    cleanup rules below. Do not ask again for each eligible item. Unknown usefulness
    is not obsolescence; leave uncertain items and report one concrete blocker.
  visual_target: >-
    The user's latest specified battlefield image is the primary target for composition,
    terrain, structures, character proportions, materials, lighting and UI together.
    It is not merely a texture suggestion. Do not substitute R11 or another concept.
    Illustrated counts, text, roster, economy and historical details are not gameplay approval.
  r8_meaning: >-
    R8 protects functioning rules, progress and a recoverable baseline; its unattractive
    art/layout is not a preservation requirement. New art/world construction may replace
    unsuitable content in an isolated candidate, with actual-image acceptance.
  no_shortcuts: >-
    No archer-only billboard conversion, actor-specific offsets/exposure hacks or hidden
    rule reductions. PNG textures/UI/VFX are legitimate; format alone is not a delete rule.

SCOPE:
  authorized_on_submission: >-
    Scoped candidate refactoring, necessary local validation, internal dispatch to existing
    teams and evidence-based cleanup in the assigned task. No repeated generic approval loop.
  live_runtime: >-
    Desktop Play.cmd runs C:\JP_DF source directly. Live runtime/assets/launcher replacement
    or removal still requires explicit release. Use isolated source and save profiles.
    Proven-unused nonruntime scratch/duplicates may be cleaned under this directive.
  preserve: >-
    Japanese-learning TD, campaign identities, progression, saves, approved unit roles,
    recruitment, learning content and numeric rules. No player-save access or copying.
  separate_authorization: >-
    Git add/commit/push/branch/merge, installations, paid assets/services, public delivery,
    engine migration, player-data/schema changes or new gameplay/balance decisions.
  excluded: [cutscenes, new_skill_activation, global_rebalance, all40_mass_production, new_ECS_framework]

